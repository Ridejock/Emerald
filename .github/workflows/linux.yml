# Linux tests (Ubuntu 24.04, GCC and Clang): configure, build (warnings in Emerald's own code are
# errors) and run the tests in the debug, release, debug-ubsan (UndefinedBehaviorSanitizer),
# debug-tsan (ThreadSanitizer) and profile (Tracy) presets. GCC debug also runs the sandbox and the
# hello-world example for a few frames on SwiftShader (CPU Vulkan, under Xvfb) and uploads the
# screenshots. Mesa's lavapipe stays installed; VK_DRIVER_FILES / VK_ICD_FILENAMES point at
# SwiftShader only, so Mesa cannot be picked. A package job builds the linux-release preset and
# uploads Sandbox-linux-x64.tar.gz. Every preset in CMakePresets.json is built with
# EMERALD_WARNINGS_AS_ERRORS on either this workflow or Windows CI. Configures pass
# EMERALD_BUILD_EXAMPLES=ON.
name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Emerald keeps its built shader compiler in a per-machine cache folder (cmake/Shaders.cmake);
# a fixed one here so the cache steps know where it is.
env:
  EMERALD_CACHE_DIR: /home/runner/emerald-cache
  DEBIAN_FRONTEND: noninteractive

jobs:
  # The shader compiler (shadercross + DirectXShaderCompiler) takes long to build: once per
  # compiler, before the test jobs, which then only restore it. Only its finished bin/ folder is
  # kept, keyed by the OS, the compiler version and the tool's recipe hash.
  shadercross:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    name: shadercross (${{ matrix.compiler }})
    outputs:
      gcc-key: ${{ steps.key.outputs.gcc }}
      clang-key: ${{ steps.key.outputs.clang }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compiler
        id: key
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then cxx=g++; else cxx=clang++; fi
          version=$($cxx -dumpversion)
          key="shadercross-bin-linux-${{ matrix.compiler }}-$version-${{ hashFiles('tools/shadercross/**') }}"
          { echo "CC=${{ matrix.compiler }}"; echo "CXX=$cxx"; echo "KEY=$key"; } >> "$GITHUB_ENV"
          echo "${{ matrix.compiler }}=$key" >> "$GITHUB_OUTPUT"

      - name: Restore shadercross
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/emerald-cache/shadercross/*/bin
          key: ${{ env.KEY }}

      - name: Packages
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      # Only the tool target (the sandbox is what asks for it), into the cache folder.
      - name: Build shadercross
        if: steps.cache.outputs.cache-hit != 'true'
        run: cmake -S . -B build/tool -G Ninja -DEMERALD_BUILD_TESTS=OFF && cmake --build build/tool --target emerald_shadercross

      - name: Save shadercross
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/emerald-cache/shadercross/*/bin
          key: ${{ env.KEY }}

  # SwiftShader's Vulkan ICD, downloaded once (tools/ci/setup-swiftshader.sh) and restored by the
  # jobs below. The files stay in the cache directory: they are not linked into the build and not
  # packed into Sandbox-linux-x64.tar.gz.
  swiftshader:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: swiftshader
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache key
        id: key
        run: echo "key=swiftshader-Linux-${{ hashFiles('tools/ci/setup-swiftshader.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftShader
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/emerald-cache/swiftshader
          key: ${{ steps.key.outputs.key }}

      - name: Fetch SwiftShader
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash tools/ci/setup-swiftshader.sh

      - name: Save SwiftShader
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/emerald-cache/swiftshader
          key: ${{ steps.key.outputs.key }}

  test:
    needs: [shadercross, swiftshader]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug, release, debug-ubsan, debug-tsan, profile]
    name: ${{ matrix.compiler }} ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            mesa-vulkan-drivers xvfb

      - name: Compiler
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then echo "CC=gcc" >> "$GITHUB_ENV"; echo "CXX=g++" >> "$GITHUB_ENV"; else echo "CC=clang" >> "$GITHUB_ENV"; echo "CXX=clang++" >> "$GITHUB_ENV"; fi

      - name: Restore shadercross
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/emerald-cache/shadercross/*/bin
          key: ${{ matrix.compiler == 'gcc' && needs.shadercross.outputs.gcc-key || needs.shadercross.outputs.clang-key }}
          fail-on-cache-miss: true

      - name: Restore SwiftShader
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/emerald-cache/swiftshader
          key: ${{ needs.swiftshader.outputs.key }}
          fail-on-cache-miss: true

      # Mesa's ICD json files are on disk (mesa-vulkan-drivers above). These variables are the
      # whole driver list: VK_DRIVER_FILES for current loaders, VK_ICD_FILENAMES for older ones.
      # VK_ADD_DRIVER_FILES is cleared so nothing else, lavapipe included, is appended.
      - name: Use SwiftShader only
        run: |
          icd=$(bash tools/ci/setup-swiftshader.sh)
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_ADD_DRIVER_FILES=" >> "$GITHUB_ENV"
          echo "EMERALD_REQUIRE_GPU=1" >> "$GITHUB_ENV"
          echo "EMERALD_REQUIRE_SWIFTSHADER=1" >> "$GITHUB_ENV"
          echo "SwiftShader ICD: $icd"
          test -s "$icd"

      # ThreadSanitizer can't map its shadow memory with the runner kernel's ASLR entropy.
      - name: Allow TSan
        if: matrix.preset == 'debug-tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      # SPIR-V only: Vulkan is the GPU backend on Linux. (The DXIL output also crashes the
      # GCC 13-built DXC here with "corrupted double-linked list"; Windows CI covers DXIL.)
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DEMERALD_WARNINGS_AS_ERRORS=ON -DEMERALD_BUILD_EXAMPLES=ON -DEMERALD_SHADER_FORMATS=SPIRV

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} 2>&1 | tee build-log.txt; exit ${PIPESTATUS[0]}

      # SDL's offscreen video driver does open a GPU swapchain with SwiftShader (the dummy
      # driver does not). RenderSmoke is verbose so the log shows the device name. It is not
      # registered in the ThreadSanitizer build.
      - name: Test
        run: |
          set -euo pipefail
          if [ "${{ matrix.preset }}" != "debug-tsan" ]; then
            SDL_VIDEODRIVER=offscreen ctest --preset ${{ matrix.preset }} --output-on-failure -R '^RenderSmoke$' --verbose
            ctest --preset ${{ matrix.preset }} --output-on-failure -E '^RenderSmoke$'
          else
            ctest --preset ${{ matrix.preset }} --output-on-failure
          fi

      # A few frames of the sandbox on SwiftShader; the last one is saved. The log must name
      # SwiftShader — lavapipe is installed and would be used if the loader variables were wrong.
      - name: Sandbox smoke run (SwiftShader)
        if: matrix.compiler == 'gcc' && matrix.preset == 'debug'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ./build/debug/bin/Sandbox --gpu vulkan --frames 30 --screenshot sandbox.png 2>&1 | tee sandbox-log.txt
          test -s sandbox.png
          grep -i swiftshader sandbox-log.txt

      # Same SwiftShader path as the sandbox, for examples/hello. The log must name SwiftShader.
      - name: Hello smoke run (SwiftShader)
        if: matrix.compiler == 'gcc' && matrix.preset == 'debug'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ./build/debug/bin/Hello --gpu vulkan --frames 30 --screenshot hello.png 2>&1 | tee hello-log.txt
          test -s hello.png
          grep -i swiftshader hello-log.txt

      - name: Upload hello screenshot
        if: always() && matrix.compiler == 'gcc' && matrix.preset == 'debug'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hello-swiftshader
          path: |
            hello.png
            hello-log.txt
          if-no-files-found: ignore

      - name: Upload screenshot
        if: always() && matrix.compiler == 'gcc' && matrix.preset == 'debug'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandbox-swiftshader
          path: |
            sandbox.png
            sandbox-log.txt
            build/debug/tests/render-smoke-actual.png
          if-no-files-found: ignore

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-${{ matrix.compiler }}-${{ matrix.preset }}
          path: |
            build-log.txt
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/${{ matrix.preset }}/tests/render-smoke-actual.png
          if-no-files-found: ignore

  # Self-contained x64 archive (static SDL3, RPATH $ORIGIN, assets, launcher). SPIR-V only, same
  # as the test jobs: the DXIL output crashes the GCC 13-built DXC here.
  package:
    needs: [shadercross, swiftshader]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    name: gcc linux-release package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            mesa-vulkan-drivers xvfb

      - name: Compiler
        run: |
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"

      - name: Restore shadercross
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/emerald-cache/shadercross/*/bin
          key: ${{ needs.shadercross.outputs.gcc-key }}
          fail-on-cache-miss: true

      - name: Restore SwiftShader
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/emerald-cache/swiftshader
          key: ${{ needs.swiftshader.outputs.key }}
          fail-on-cache-miss: true

      - name: Use SwiftShader only
        run: |
          icd=$(bash tools/ci/setup-swiftshader.sh)
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_ADD_DRIVER_FILES=" >> "$GITHUB_ENV"
          echo "SwiftShader ICD: $icd"
          test -s "$icd"

      - name: Configure
        run: cmake --preset linux-release -DEMERALD_WARNINGS_AS_ERRORS=ON -DEMERALD_BUILD_EXAMPLES=ON -DEMERALD_SHADER_FORMATS=SPIRV

      - name: Package
        run: cmake --build --preset linux-release

      - name: Check the archive
        run: |
          archive=build/linux-release/dist/Sandbox-linux-x64.tar.gz
          test -s "$archive"
          tar -tzf "$archive" | tee package-list.txt
          grep -qx 'Sandbox-linux-x64/Sandbox' package-list.txt
          grep -qx 'Sandbox-linux-x64/Sandbox.sh' package-list.txt
          grep -qx 'Sandbox-linux-x64/assets/sprites/hero.png' package-list.txt
          grep -qx 'Sandbox-linux-x64/shaders/Sprite.frag.spv' package-list.txt
          root=$(mktemp -d)
          tar -xzf "$archive" -C "$root"
          bin="$root/Sandbox-linux-x64/Sandbox"
          readelf -d "$bin" | tee readelf.txt
          grep -E 'RPATH|RUNPATH' readelf.txt | grep -F '$ORIGIN'
          ldd "$bin" | tee ldd.txt
          if grep -E 'libSDL3|libstdc\+\+|libgcc_s' ldd.txt; then
            echo "::error::the package should link SDL, libstdc++ and libgcc statically"
            exit 1
          fi
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "$bin" --gpu vulkan --frames 20 --screenshot "$root/shot.png" 2>&1 | tee package-smoke.txt
          test -s "$root/shot.png"
          grep -i swiftshader package-smoke.txt

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Sandbox-linux-x64
          path: build/linux-release/dist/Sandbox-linux-x64.tar.gz
          if-no-files-found: error

      - name: Upload package logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-package-logs
          path: |
            package-list.txt
            readelf.txt
            ldd.txt
            package-smoke.txt
          if-no-files-found: ignore
