# Windows tests: configure, build (warnings in Emerald's own code are errors) and run the tests,
# in the debug and debug-asan presets (no ImGui: the editor tools compile out), debug-full
# (ImGui on: the editor tools, their tests and the sandbox's panels) and release (no hot reload,
# NDEBUG).
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Emerald keeps its built shader compiler in a per-machine cache folder (cmake/Shaders.cmake);
# a fixed one here so the cache step below knows where it is.
env:
  EMERALD_CACHE_DIR: C:/emerald-cache

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, debug-asan, debug-full, release]
    name: ${{ matrix.preset }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # cl.exe, INCLUDE/LIB and Ninja on the PATH. x64: an x86 shell cannot link ASan builds.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # The shader compiler (shadercross + DirectXShaderCompiler, built with MSVC) takes a long
      # time to build. Only its finished bin/ folder is kept (a few MB, with the marker that tells
      # Emerald to use it as is), in a folder named after the tool's recipe hash: a restored
      # folder that still matches is used without any build step. Saved after a successful build
      # (below), so a later failing step (warnings, tests) does not throw it away.
      - name: Restore shadercross
        id: shadercross
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: C:/emerald-cache/shadercross/*/bin
          # The MSVC version too: a runner image update rebuilds the tool with the new compiler.
          key: shadercross-bin-windows-${{ env.VCToolsVersion }}-${{ hashFiles('tools/shadercross/**') }}
          restore-keys: shadercross-bin-windows-${{ env.VCToolsVersion }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DEMERALD_WARNINGS_AS_ERRORS=ON

      - name: Build
        id: build
        run: cmake --build --preset ${{ matrix.preset }} 2>&1 | tee build-log.txt; exit ${PIPESTATUS[0]}

      - name: Save shadercross
        if: steps.build.outcome == 'success' && steps.shadercross.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true # another preset may save the same key first
        with:
          path: C:/emerald-cache/shadercross/*/bin
          key: ${{ steps.shadercross.outputs.cache-primary-key }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # The Visual Studio generator must list the .hlsl files as None, not FXCompile (fxc rejects
      # the SDL GPU register spaces). Configure only; no build.
      - name: Check Visual Studio project
        if: matrix.preset == 'debug'
        run: |
          # The newest Visual Studio generator this CMake has (the runner's VS version changes).
          gen=$(cmake --help | grep -oE "Visual Studio [0-9]+ [0-9]{4}" | head -1)
          echo "Generator: $gen"
          cmake -S . -B build/vs -G "$gen" -A x64 -DEMERALD_BUILD_TESTS=OFF > vs-configure.txt 2>&1 \
            || { cat vs-configure.txt; exit 1; }
          if grep -rl "FXCompile" build/vs --include=*.vcxproj; then
            echo "::error::.hlsl files are set to FXCompile in the Visual Studio project"
            exit 1
          fi
          grep -rhoE '<None Include="[^"]+\.hlsl"' build/vs --include=*.vcxproj | sort -u

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-${{ matrix.preset }}
          path: |
            build-log.txt
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
