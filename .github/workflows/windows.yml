# Windows tests: configure, build (zero MSVC warnings in Emerald's own code) and run the tests,
# in the debug and debug-asan presets (no ImGui: the editor tools compile out) and debug-full
# (ImGui on: the editor tools, their tests and the sandbox's panels).
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Emerald keeps its built shader compiler in a per-machine cache folder (cmake/Shaders.cmake);
# a fixed one here so the cache step below knows where it is.
env:
  EMERALD_CACHE_DIR: C:/emerald-cache

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, debug-asan, debug-full]
    name: ${{ matrix.preset }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # cl.exe, INCLUDE/LIB and Ninja on the PATH. x64: an x86 shell cannot link ASan builds.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The shader compiler (shadercross + DirectXShaderCompiler, built with MSVC) takes a long
      # time to build. Only its finished bin/ folder is kept (a few MB, with the marker that tells
      # Emerald to use it as is), in a folder named after the tool's recipe hash: a restored
      # folder that still matches is used without any build step. Saved after a successful build
      # (below), so a later failing step (warnings, tests) does not throw it away.
      - name: Restore shadercross
        id: shadercross
        uses: actions/cache/restore@v4
        with:
          path: C:/emerald-cache/shadercross/*/bin
          key: shadercross-bin-windows-${{ hashFiles('tools/shadercross/**') }}
          restore-keys: shadercross-bin-windows-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        id: build
        run: cmake --build --preset ${{ matrix.preset }} 2>&1 | tee build-log.txt; exit ${PIPESTATUS[0]}

      - name: Save shadercross
        if: steps.build.outcome == 'success' && steps.shadercross.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true # another preset may save the same key first
        with:
          path: C:/emerald-cache/shadercross/*/bin
          key: ${{ steps.shadercross.outputs.cache-primary-key }}

      # Zero warnings in Emerald's code. Fetched libraries (_deps) and the shadercross tool
      # (in emerald-cache, e.g. C5051 in SPIRV-Cross) are not ours to fix.
      - name: Check for warnings
        run: |
          grep -E "warning C[0-9]+" build-log.txt \
            | grep -viE "[\\/]_deps[\\/]|emerald-cache" \
            | sort -u > warnings.txt || true
          if [ -s warnings.txt ]; then
            echo "::error::MSVC warnings in Emerald:"
            cat warnings.txt
            exit 1
          fi
          echo "No MSVC warnings in Emerald."

      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
