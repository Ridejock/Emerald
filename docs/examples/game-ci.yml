# Caller for ROCK BLASTER and ROCK BLASTER ROGUE
# (https://github.com/Ridejock/Asteroids). Save as .github/workflows/release.yml.
# Both games live in that one repo; there is no separate Rock Blaster repository.
#
# itch-user is the itch.io account for
# https://ridejock.itch.io/rock-blaster and .../rock-blaster-rogue.
# The repository secret BUTLER_API_KEY is required for a tag to upload.
# Empty itch-user, or a missing key, skips the itch upload and leaves the run green.
#
# tools/ci is checked out from Emerald by game.yml. Do not copy those scripts.
# Each game target calls emerald_set_warnings so EMERALD_WARNINGS_AS_ERRORS
# applies. An older engine pin that ignores the flag needs a bump.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The caller's group. game.yml uses emerald-game-${{ github.workflow }}-${{ github.ref }}
# so this does not deadlock with the called workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game:
    uses: Ridejock/Emerald/.github/workflows/game.yml@main
    with:
      presets: release
      platforms: windows,linux
      package-preset: release
      cmake-target: package
      itch-user: ridejock
      itch-games: |
        RockBlasterRogue rock-blaster-rogue
        RockBlaster rock-blaster
    secrets:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

  # The previous release workflow attached the zips to the GitHub release of
  # the tag. Artifacts uploaded by the reusable workflow are still available
  # here. The itch upload is the reusable workflow's publish job.
  github-release:
    needs: game
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Require an archive
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.zip dist/*.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::The package job uploaded no .zip or .tar.gz"
            exit 1
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
          fail_on_unmatched_files: false
